
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Notes</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  body {
    margin: 0;
    padding: 35px 24px;
    background: #171717;
    color: #e6e2dc;
    font-family: Georgia, serif;
    line-height: 1.9;
  }

  .container {
    max-width: 600px;
    margin: auto;
  }

  .label {
    font-family: sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #888;
  }

  h1 {
    font-size: 30px;
    font-weight: normal;
    margin: 15px 0 5px;
  }

  .artist {
    color: #999;
    font-size: 14px;
  }

  hr {
    border: none;
    border-top: 1px solid #333;
    margin: 28px 0;
  }

  .translation {
    font-size: 17px;
    white-space: pre-line;
  }

  .error {
    color: #aaa;
  }
</style>
</head>

<body>
<div class="container">
  <div class="label">SONG NOTES</div>

  <h1 id="title">Loading...</h1>
  <div class="artist" id="artist"></div>

  <hr>

  <div class="translation" id="text"></div>
</div>

<script>
const songs = {
  "world-spins": {
    title: "The World Spins",
    artist: "Julee Cruise",
    text: `Your translation goes here.

Your second paragraph goes here.

Your personal interpretation can go here.`
  },

  "into-night": {
    title: "Into the Night",
    artist: "Artist Name",
    text: `The translation for the second song goes here.`
  }
};

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const songID =
  tg.initDataUnsafe?.start_param ||
  new URLSearchParams(window.location.search).get("startapp");

const song = songs[songID];

if (song) {
  document.getElementById("title").textContent = song.title;
  document.getElementById("artist").textContent = song.artist;
  document.getElementById("text").textContent = song.text;
} else {
  document.getElementById("title").textContent = "Song not found";
  document.getElementById("artist").textContent = "";
  document.getElementById("text").textContent =
    "This song ID does not exist.";
  document.getElementById("text").classList.add("error");
}
</script>
</body>
</html>
